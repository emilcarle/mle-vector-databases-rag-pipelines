[project]
name = "mle-vector-databases-rag-pipelines"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.14.2",
    "langchain-core>=1.0.0",
    "langchain-huggingface>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-qdrant>=1.0.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.16.0",
    "sentence-transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
